name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    timeout-minutes: 10
    name: Node v${{ matrix.node-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x, 17.x, 18.x, 19.x, 20.x]
        os: [ubuntu-latest, macOS-latest, windows-latest]
        # macOS-latest is Apple Silicon: Node 10-14 have no arm64 build, so they run on Intel
        exclude:
          - os: macOS-latest
            node-version: 10.x
          - os: macOS-latest
            node-version: 12.x
          - os: macOS-latest
            node-version: 14.x
        include:
          - os: macos-15-intel
            node-version: 10.x
          - os: macos-15-intel
            node-version: 12.x
          - os: macos-15-intel
            node-version: 14.x
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set git config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
        if: runner.os == 'Windows'
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 #latest v2. TODO upgrade
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 #latest  v2. TODO upgrade
        with:
          node-version: ${{ matrix.node-version }}
      - name: Create the npm cache directory
        run: mkdir npm-cache && npm config set cache ./npm-cache --global
      - name: Cache node modules
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace #latest v2 TODO upgrade
        with:
          path: ./npm-cache
          key: v1-${{ runner.os }}-node-${{ matrix.node-version }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            v1-${{ runner.os }}-node-${{ matrix.node-version }}-npm-
      - run: npm install
      - run: npm test
        env:
          CI: true
          # Puppeteer's own Chrome 78 has no Apple Silicon build: use the runner's Chrome there
          PUPPETEER_EXECUTABLE_PATH: ${{ matrix.os == 'macOS-latest' && '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' || '' }}

  benchmark:
    timeout-minutes: 15
    name: Measure performance impact of changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 #latest v2. TODO upgrade
      - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 #latest  v2. TODO upgrade
        with:
          node-version: 18
      - name: Create the npm cache directory
        run: mkdir npm-cache && npm config set cache ./npm-cache --global
      - name: Cache node modules
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace #latest v2 TODO upgrade
        with:
          path: ./npm-cache
          key: v1-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            v1-npm-
      - run: npm install
      - run: npm run benchmark
        env:
          CI: true

  typescript:
    timeout-minutes: 15
    name: Ensure typescript compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 #latest v2. TODO upgrade
      - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 #latest  v2. TODO upgrade
        with:
          node-version: 18
      - name: Create the npm cache directory
        run: mkdir npm-cache && npm config set cache ./npm-cache --global
      - name: Cache node modules
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace #latest v2 TODO upgrade
        with:
          path: ./npm-cache
          key: v1-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            v1-npm-
      - run: npm install
      - run: npx tsc index.d.ts
        env:
          CI: true
